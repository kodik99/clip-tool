<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip</title>
<style>
  :root {
    --bg: #0c0c0c; --fg: #cfcfcf; --dim: #6b6b6b; --acc: #7dd02e; --err: #ff5f56; --red: #e0524a; --line: #262626;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4ef; --fg: #1c1c1c; --dim: #8a8a82; --acc: #2a6b00; --err: #c0281c; --red: #c0281c; --line: #d6d6cc; }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0 auto; max-width: 760px; padding: 28px 16px 80px;
    background: var(--bg); color: var(--fg);
    font: 14px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  h1 { font-size: 14px; font-weight: normal; margin: 0 0 18px; color: var(--acc); }
  .dim { color: var(--dim); }
  .row { display: flex; gap: 10px; align-items: baseline; margin: 7px 0; flex-wrap: wrap; }
  .row > label:first-child { width: 78px; color: var(--dim); flex: none; }
  input[type=text], select {
    background: transparent; color: var(--fg); border: 0; border-bottom: 1px solid var(--line);
    font: inherit; padding: 2px 4px; border-radius: 0; outline: none;
  }
  input[type=text] { flex: 1; min-width: 200px; }
  input[type=text]:focus, select:focus { border-bottom-color: var(--acc); }
  select option { background: var(--bg); color: var(--fg); }
  label.opt { cursor: pointer; margin-right: 8px; }
  input[type=radio], input[type=checkbox] { accent-color: var(--acc); }
  button, .btn {
    background: transparent; color: var(--fg); border: 1px solid var(--line); font: inherit;
    padding: 2px 10px; cursor: pointer; border-radius: 0;
  }
  button:hover, .btn:hover { border-color: var(--acc); color: var(--acc); }
  button.go { color: var(--acc); border-color: var(--acc); margin-top: 10px; }
  button.kill { color: var(--red); border-color: var(--red); margin-top: 0; }
  button.kill:hover { background: var(--red); color: var(--bg); border-color: var(--red); }
  button:disabled { opacity: .4; cursor: default; }
  #drop { border: 1px dashed var(--line); padding: 6px 12px; color: var(--dim); cursor: pointer; flex: 1; min-width: 180px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #drop.over { border-color: var(--acc); color: var(--acc); }
  #drop.has { color: var(--fg); border-style: solid; }
  fieldset { border: 1px solid var(--line); margin: 16px 0; padding: 8px 14px 10px; min-width: 0; }
  fieldset:focus-within { border-color: #3d3d3d; }
  legend { color: var(--dim); padding: 0 6px; font-size: 12px; }
  legend b { color: var(--acc); font-weight: normal; }
  .row > label.opt:first-child { width: auto; color: var(--fg); margin-right: 4px; }
  .sub { margin: 2px 0 6px 22px; padding: 2px 0 2px 14px; border-left: 1px solid var(--line); }
  .small { font-size: 12px; }
  .head { display: flex; gap: 10px; align-items: baseline; margin: 2px 0 12px; }
  .job { margin: 0 0 18px; }
  .job .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { color: var(--acc); white-space: pre; }
  .err { color: var(--err); }
  .log { color: var(--dim); font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  video { display: block; margin: 8px 0 4px; height: 340px; max-width: 100%; background: #000; }
  a { color: var(--acc); text-decoration: none; }
  a:hover { text-decoration: underline; }
  input[type=file] { display: none; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  header h1 { margin: 0; }
  #orbit { display: grid; grid-template-columns: repeat(19, 1ch); grid-auto-rows: 1.12em; line-height: 1.12em;
           user-select: none; font-size: 12px; }
  #orbit i { font-style: normal; text-align: center; }
  #orbit .r { color: var(--line); }
  #orbit .b { color: var(--dim); }
  #orbit .f { color: var(--acc); }
  #orbit .c { color: var(--acc); font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>$ clip <span class="dim">— link or file in, 9:16 + banner + captions out</span></h1>
  <div id="orbit" aria-hidden="true"></div>
</header>

<fieldset>
  <legend><b>1</b> source</legend>
  <div class="row">
    <input type="text" id="url" placeholder="paste a video link" autocomplete="off" spellcheck="false">
    <span class="dim">or</span>
    <div id="drop">drop a file here</div>
    <input type="file" id="file" accept="video/*">
  </div>
</fieldset>

<fieldset>
  <legend><b>2</b> look</legend>
  <div class="row">
    <label>banner</label>
    <select id="banner"></select>
    <button id="addb" type="button">+ upload</button>
    <input type="file" id="bfile" accept="video/mp4">
  </div>
  <div class="row">
    <label>layout</label>
    <label class="opt"><input type="radio" name="layout" value="blur" checked> blur-fill</label>
    <label class="opt"><input type="radio" name="layout" value="crop"> crop</label>
    <label class="opt"><input type="radio" name="layout" value="fit"> fit</label>
  </div>
  <div class="row">
    <label>captions</label>
    <label class="opt"><input type="checkbox" id="caps" checked> on</label>
    <select id="model">
      <option value="tiny">tiny</option><option value="base">base</option>
      <option value="small" selected>small</option><option value="medium">medium</option>
    </select>
    <input type="text" id="lang" placeholder="lang (auto)" style="flex:none;min-width:0;width:100px" maxlength="5">
  </div>
</fieldset>

<fieldset>
  <legend><b>3</b> mode</legend>
  <div class="row"><label class="opt"><input type="radio" name="mode" value="whole" checked> whole video</label><span class="dim small">no ai, no cost</span></div>
  <div class="row"><label class="opt"><input type="radio" name="mode" value="clips"> find clips</label><span class="dim small">whisper + claude pick the best moments and write descriptions (cents)</span></div>
  <div class="sub" id="clipopts" style="display:none">
    <div class="row"><span>from <input type="text" id="tfrom" placeholder="0:00" style="flex:none;min-width:0;width:64px"> to <input type="text" id="tto" placeholder="end" style="flex:none;min-width:0;width:64px"></span></div>
    <div class="row">
      <span>max <input type="text" id="nclips" value="5" style="flex:none;min-width:0;width:34px"> clips</span>
      <span>length <input type="text" id="minlen" value="15" style="flex:none;min-width:0;width:34px">-<input type="text" id="maxlen" value="60" style="flex:none;min-width:0;width:34px"> s</span>
      <span>desc lang <input type="text" id="dlang" placeholder="same as video" style="flex:none;min-width:0;width:120px"></span>
    </div>
  </div>
</fieldset>

<div class="row" style="margin:14px 0 0"><button class="go" id="run" style="margin-top:0">run &gt;</button><button class="kill" id="kill" type="button" title="stop the current job and delete all of its files">kill + delete</button><span id="msg" class="err"></span></div>

<fieldset style="margin-top:22px">
  <legend><b>4</b> output</legend>
  <div class="head"><button id="clear" type="button">clear all</button><span id="usage" class="dim small"></span></div>
  <div id="jobs" class="dim">no jobs yet</div>
</fieldset>

<script>
const $ = id => document.getElementById(id);
let picked = null;

async function loadBanners(sel) {
  const list = await (await fetch('/api/banners')).json();
  $('banner').innerHTML = '';
  for (const b of list) { const o = document.createElement('option'); o.value = o.textContent = b; $('banner').appendChild(o); }
  if (sel) $('banner').value = sel;
}

// file pick / drop
const drop = $('drop');
function setFile(f) {
  picked = f;
  drop.textContent = f ? f.name : 'drop a file here';
  drop.classList.toggle('has', !!f);
  if (f) $('url').value = '';
}
drop.onclick = () => $('file').click();
$('file').onchange = e => setFile(e.target.files[0] || null);
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
$('url').oninput = () => { if ($('url').value) setFile(null); };

// banner upload
$('addb').onclick = () => $('bfile').click();
$('bfile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/api/banners', { method: 'POST', body: fd });
  if (r.ok) loadBanners((await r.json()).name); else $('msg').textContent = 'banner upload failed';
  e.target.value = '';
};

// mode toggle
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => {
  const clips = document.querySelector('input[name=mode]:checked').value === 'clips';
  $('clipopts').style.display = clips ? '' : 'none';
});

// run
$('run').onclick = async () => {
  $('msg').textContent = '';
  const url = $('url').value.trim();
  if (!url && !picked) { $('msg').textContent = 'need a link or a file'; return; }
  if (!$('banner').value) { $('msg').textContent = 'need a banner'; return; }
  const fd = new FormData();
  fd.append('url', url);
  if (picked) fd.append('file', picked);
  fd.append('banner', $('banner').value);
  fd.append('layout', document.querySelector('input[name=layout]:checked').value);
  fd.append('captions', $('caps').checked ? 'true' : 'false');
  fd.append('model', $('model').value);
  fd.append('language', $('lang').value);
  const mode = document.querySelector('input[name=mode]:checked').value;
  fd.append('mode', mode);
  if (mode === 'clips') {
    fd.append('t_from', $('tfrom').value); fd.append('t_to', $('tto').value); fd.append('max_clips', $('nclips').value || '5');
    fd.append('min_len', $('minlen').value || '15'); fd.append('max_len', $('maxlen').value || '60');
    fd.append('desc_lang', $('dlang').value);
  }
  $('run').disabled = true;
  try {
    const r = await fetch('/api/jobs', { method: 'POST', body: fd });
    if (!r.ok) { $('msg').textContent = (await r.json()).detail || 'failed'; }
    else { $('url').value = ''; setFile(null); poll(); }
  } finally { $('run').disabled = false; }
};

// clear all
function fmt(b) { return b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(0) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB'; }
async function usage() {
  try { const u = await (await fetch('/api/usage')).json(); $('usage').textContent = u.bytes ? fmt(u.bytes) + ' on disk' : 'nothing stored'; } catch (e) {}
}
$('clear').onclick = async () => {
  if (!confirm('Delete ALL generated videos and working files?\nBanners are kept. Download anything you want first.')) return;
  const r = await fetch('/api/jobs', { method: 'DELETE' });
  if (r.status === 409) { $('msg').textContent = 'wait for the running job to finish'; return; }
  const d = await r.json();
  for (const k of Object.keys(els)) { els[k].root.remove(); delete els[k]; }
  $('jobs').className = 'dim'; $('jobs').textContent = 'cleared ' + fmt(d.freed);
  usage();
};

// kill + delete: stop the current job, wipe its files, reset the inputs
$('kill').onclick = async () => {
  if (!confirm('Kill the current job and delete everything it made (downloads, scratch files and its clips)?')) return;
  $('kill').disabled = true; $('msg').textContent = '';
  try {
    const r = await fetch('/api/kill', { method: 'POST' });
    const d = await r.json();
    $('url').value = ''; setFile(null);
    $('msg').className = 'dim'; $('msg').textContent = d.killed ? 'killed + wiped' : d.deleted ? 'wiped the last job' : 'nothing to kill';
    setTimeout(() => { $('msg').textContent = ''; $('msg').className = 'err'; }, 3000);
  } catch (e) { $('msg').textContent = 'kill failed'; }
  finally { $('kill').disabled = false; poll(); usage(); }
};

// jobs
function bar(p) { const n = Math.round(p / 5); return '[' + '#'.repeat(n) + '.'.repeat(20 - n) + '] ' + String(Math.round(p)).padStart(3) + '%'; }
const els = {};
function render(list) {
  const box = $('jobs');
  const ids = new Set(list.map(j => j.id));
  for (const k of Object.keys(els)) if (!ids.has(k)) { els[k].root.remove(); delete els[k]; }
  if (!list.length) { box.textContent = 'no jobs yet'; return; }
  if (box.classList.contains('dim')) { box.classList.remove('dim'); box.textContent = ''; }
  for (const j of list) {
    let e = els[j.id];
    if (!e) {
      e = els[j.id] = { root: document.createElement('div') };
      e.root.className = 'job';
      e.t = document.createElement('div'); e.t.className = 't';
      e.s = document.createElement('div');
      e.n = document.createElement('div'); e.n.className = 'log';
      e.l = document.createElement('div'); e.l.className = 'log';
      e.v = document.createElement('div');
      e.root.append(e.t, e.s, e.n, e.l, e.v);
      box.appendChild(e.root);
    }
    e.t.textContent = '> ' + j.title;
    e.n.textContent = j.note || '';
    if (j.status === 'done') {
      e.s.className = 'bar'; e.s.textContent = bar(100) + ' done';
      if (!e.v.firstChild) {
        for (const o of j.outputs) {
          const box = document.createElement('div'); box.style.margin = '12px 0 18px';
          if (o.title) { const t = document.createElement('div'); t.style.color = 'var(--acc)'; t.textContent = '# ' + o.title + (o.start !== undefined ? '  (' + o.start + 's-' + o.end + 's)' : ''); box.append(t); }
          const v = document.createElement('video'); v.controls = true; v.src = '/out/' + o.file; v.preload = 'metadata';
          const a = document.createElement('a'); a.href = '/out/' + o.file + '?dl=1'; a.textContent = 'download ' + o.file;
          box.append(v, a);
          if (o.description) {
            const d = document.createElement('div'); d.style.cssText = 'margin-top:6px;white-space:pre-wrap'; d.textContent = o.description;
            const c = document.createElement('button'); c.textContent = 'copy description'; c.style.marginTop = '4px';
            c.onclick = async () => { try { await navigator.clipboard.writeText(o.description); c.textContent = 'copied'; } catch (_) { c.textContent = 'select + copy manually'; } setTimeout(() => c.textContent = 'copy description', 1500); };
            box.append(d, c);
          }
          e.v.append(box);
        }
      }
      e.l.textContent = '';
    } else if (j.status === 'error') {
      e.s.className = 'err'; e.s.textContent = 'failed';
      e.l.textContent = j.log.slice(-6).join('\n');
    } else {
      e.s.className = 'bar'; e.s.textContent = bar(j.pct) + ' ' + j.stage;
      e.l.textContent = '';
    }
  }
  // keep newest first
  for (const j of [...list].reverse()) box.prepend(els[j.id].root);
}
let timer = null;
async function poll() {
  clearTimeout(timer);
  let list = [];
  try { list = await (await fetch('/api/jobs')).json(); render(list); usage(); } catch (e) {}
  const busy = list.some(j => j.status === 'queued' || j.status === 'running');
  orbitSpeed = busy ? 3 : 1;
  timer = setTimeout(poll, busy ? 1000 : 4000);
}
// ascii orbit: a "$" with currencies circling it (faster while a job runs)
let orbitSpeed = 1;
(function () {
  const W = 19, H = 9, cx = 9, cy = 4, rx = 8, ry = 3.6;
  const coins = ['€', '£', '¥', '₩', '₹', '₿'];
  const el = $('orbit'), cells = [];
  for (let k = 0; k < W * H; k++) { const c = document.createElement('i'); c.textContent = ' '; el.appendChild(c); cells.push(c); }
  let t = 0;
  function frame() {
    const g = new Array(W * H).fill(null);
    const put = (x, y, ch, cls) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < W && y >= 0 && y < H) g[y * W + x] = [ch, cls]; };
    for (let k = 0; k < 40; k++) { const a = k / 40 * 2 * Math.PI; put(cx + rx * Math.cos(a), cy + ry * Math.sin(a), '·', 'r'); }
    coins.forEach((ch, i) => {
      const a = t + i * 2 * Math.PI / coins.length;
      put(cx + rx * Math.cos(a), cy + ry * Math.sin(a), ch, Math.sin(a) > 0 ? 'f' : 'b');   // lower half = in front
    });
    put(cx, cy, '$', 'c');
    for (let k = 0; k < g.length; k++) {
      const [ch, cls] = g[k] || [' ', ''];
      if (cells[k].textContent !== ch) cells[k].textContent = ch;
      if (cells[k].className !== cls) cells[k].className = cls;
    }
  }
  frame();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
    setInterval(() => { t += 0.07 * orbitSpeed; frame(); }, 80);
})();

loadBanners(); poll();
</script>
</body>
</html>
